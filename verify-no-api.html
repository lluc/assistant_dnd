<!DOCTYPE html>
<html>
<head>
    <title>Test - No API Calls</title>
    <script type="module">
        // Override fetch to detect any API calls
        const originalFetch = window.fetch;
        window.fetch = function(...args) {
            console.error('❌ API CALL DETECTED:', args[0]);
            if (args[0] && args[0].includes('dnd5eapi.co')) {
                throw new Error('API call detected! This should not happen with static data.');
            }
            return originalFetch.apply(this, args);
        };

        // Test the monster API functions
        import { dndAPI } from './js/api.js';

        async function testMonsterAPI() {
            console.log('🧪 Testing monster API functions...');

            try {
                // Test 1: Get monsters list
                console.log('Testing getMonstersList()...');
                const list = await dndAPI.getMonstersList();
                console.log(`✅ Got ${list.results.length} monsters`);

                // Test 2: Get monster details
                console.log('Testing getMonsterDetails()...');
                const monster = await dndAPI.getMonsterDetails('aboleth');
                console.log(`✅ Got details for ${monster.name}`);

                // Test 3: Search monsters
                console.log('Testing searchMonsters()...');
                const searchResults = await dndAPI.searchMonsters('dragon');
                console.log(`✅ Found ${searchResults.length} dragons`);

                // Test 4: Filter monsters
                console.log('Testing getMonstersByFilters()...');
                const filteredResults = await dndAPI.getMonstersByFilters('fiend');
                console.log(`✅ Found ${filteredResults.length} fiends`);

                console.log('🎉 All tests passed! No API calls detected.');

            } catch (error) {
                console.error('❌ Test failed:', error);
            }
        }

        // Run tests when DOM is ready
        document.addEventListener('DOMContentLoaded', testMonsterAPI);
    </script>
</head>
<body>
    <h1>Monster API Test - No Network Calls</h1>
    <p>Open the console to see test results.</p>
    <p>If you see any API call warnings, the static data migration has failed.</p>
</body>
</html>
