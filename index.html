<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Assistant pour Maître de Jeu Donjons & Dragons - Recherche d'équipement et outils de jeu">
    <meta name="theme-color" content="#e63946">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="D&D Assistant">
    <title>Assistant D&D MJ</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <link rel="icon" type="image/png" href="icons/icon-192x192.png" sizes="192x192">
    <link rel="icon" type="image/png" href="icons/icon-512x512.png" sizes="512x512">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <div id="app">
        <dnd-header></dnd-header>
        
        <main id="main-content">
            <section id="equipment-section" class="page-section">
                <div class="container">
                    <h1 class="page-title">Recherche d'Équipement</h1>
                    <equipment-search></equipment-search>
                    <div id="equipment-results" class="results-grid"></div>
                </div>
            </section>
            
            <section id="spells-section" class="page-section hidden">
                <div class="container">
                    <h1 class="page-title">Grimoire des Sorts</h1>
                    <spells-search></spells-search>
                    <div id="spells-results" class="results-grid"></div>
                </div>
            </section>

            <section id="favorites-section" class="page-section hidden">
                <div class="container">
                    <h1 class="page-title">Équipement Favori</h1>
                    <div id="favorites-results" class="results-grid"></div>
                </div>
            </section>
            
            <section id="dice-section" class="page-section hidden">
                <div class="container">
                    <h1 class="page-title">Lanceur de Dés</h1>
                    <dice-roller></dice-roller>
                </div>
            </section>
        </main>
        
        <footer>
            <p>&copy; 2024 Assistant D&D MJ - Créé avec les API D&D5E</p>
        </footer>
    </div>
    
    <div id="loading-overlay" class="loading-overlay hidden">
        <div class="loading-spinner"></div>
        <p>Recherche en cours...</p>
    </div>
    
    <script type="module" src="js/app.js"></script>
</body>
</html>
